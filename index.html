<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Popote</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    .solde {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }

    .carte {
      margin: 20px 0;
    }

    .ligne {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .euro {
      width: 45px;
      font-weight: bold;
    }

    .cases {
      display: flex;
      gap: 3px;
      flex: 1;
    }

    .case {
      height: 22px;
      flex: 1;
      border-radius: 4px;
      background: #5cb85c;
      border: 1px solid #4a9f4a;
    }

    .case.vide {
      background: #ddd;
      border-color: #ccc;
    }

    .boutons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    .moins {
      background: #e74c3c;
      color: white;
    }

    .plus {
      background: #3498db;
      color: white;
    }

    .reset {
      background: #555;
      color: white;
      width: 100%;
      margin-top: 15px;
    }

    .info {
      text-align: center;
      color: #666;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🍺 Ma Popote</h1>

  <div class="solde">
    <span id="solde">10,00</span> €
  </div>

  <div class="carte" id="carte"></div>

  <div class="boutons">
    <button class="moins" onclick="consommer(10)">− 0,10 €</button>
    <button class="moins" onclick="consommer(50)">− 0,50 €</button>
    <button class="moins" onclick="consommer(100)">− 1,00 €</button>
    <button class="moins" onclick="consommer(200)">− 2,00 €</button>

    <button class="plus" onclick="recharger(100)">+ 1,00 €</button>
    <button class="plus" onclick="recharger(500)">+ 5,00 €</button>
    <button class="plus" onclick="recharger(1000)">+ 10,00 €</button>
  </div>

  <button class="reset" onclick="reinitialiser()">
    Remettre à 10,00 €
  </button>

  <div class="info">
    Chaque case = 0,10 €
  </div>

</div>

<script>

let solde = 1000; // 10,00 € en centimes

function afficher() {

  document.getElementById("solde").textContent =
    (solde / 100).toFixed(2).replace(".", ",");

  const carte = document.getElementById("carte");

  carte.innerHTML = "";

  for (let ligne = 0; ligne < 10; ligne++) {

    const divLigne = document.createElement("div");
    divLigne.className = "ligne";

    const euro = document.createElement("div");
    euro.className = "euro";
    euro.textContent = "1 €";

    const cases = document.createElement("div");
    cases.className = "cases";

    for (let colonne = 0; colonne < 10; colonne++) {

      const numeroCase = ligne * 10 + colonne;

      const divCase = document.createElement("div");
      divCase.className = "case";

      if (numeroCase >= Math.ceil(solde / 10)) {
        divCase.classList.add("vide");
      }

      cases.appendChild(divCase);
    }

    divLigne.appendChild(euro);
    divLigne.appendChild(cases);

    carte.appendChild(divLigne);
  }
}

function consommer(montant) {

  if (solde - montant < 0) {
    alert("Solde insuffisant !");
    return;
  }

  solde -= montant;
  afficher();
}

function recharger(montant) {

  if (solde + montant > 1000) {
    alert("Le maximum est de 10,00 €.");
    return;
  }

  solde += montant;
  afficher();
}

function reinitialiser() {

  solde = 1000;
  afficher();
}

afficher();

</script>

</body>
</html>
